<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Codiware</title>
  <script>window.CODIWARE_BOOT = /*__CODIWARE_BOOT__*/ null /*__/CODIWARE_BOOT__*/;</script>
  <script>
    (function () {
      var b = window.CODIWARE_BOOT || {};
      var base = (b.url_base || '/').replace(/\/$/, '');
      var assetsApp = base + b.url_to_app.replace(/\/$/, '');
      var assetsNpm = base + b.url_to_npm.replace(/\/$/, ''); 
      var assetVersion = b.cache_bust || '';

      function css(href, id, disabled) {
        var l = document.createElement('link');
        l.rel = 'stylesheet'; l.href = href; if (id) l.id = id;
        if (disabled) l.disabled = true;
        document.head.appendChild(l);
      }
      css(assetsNpm + '/font-awesome/css/font-awesome.min.css?v=' + assetVersion, 'codiware-css-fa');
      css(assetsApp + '/css/base.css?v=' + assetVersion, 'codiware-css-base');
      css(assetsApp + '/css/theme-light.css?v=' + assetVersion, 'codiware-css-light');
      css(assetsApp + '/css/theme-dark.css?v=' + assetVersion, 'codiware-css-dark', true);
      css(assetsNpm + '/toast-ui--editor/dist/toastui-editor.css?v=' + assetVersion, 'codiware-css-toastui');
      css(assetsNpm + '/toast-ui--editor/dist/theme/toastui-editor-dark.css?v=' + assetVersion, 'codiware-css-toastui-dark', true);
      window.CODIWARE_ASSET_BASE_APP = assetsApp;
      window.CODIWARE_ASSET_BASE_NPM = assetsNpm;
    })();
  </script>
</head>
<body>
  <div id="codiware-root" class="ide-root" aria-busy="true">
    <div class="ide-loading">Loading Codiware…</div>
  </div>
  <script>
    (function () {
      var s = document.createElement('script');
      s.type = 'module';
      s.src = window.CODIWARE_ASSET_BASE_APP + '/js/app.js?v=' + window.CODIWARE_BOOT?.cache_bust || '';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
